<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase config */
const firebaseConfig = {
    apiKey: "AIzaSyA3palpYZDFdNpBDIF564YsiOAN2dtbxzA",
    authDomain: "tic-tac-toe-87d49.firebaseapp.com",
    projectId: "tic-tac-toe-87d49",
    storageBucket: "tic-tac-toe-87d49.firebasestorage.app",
    messagingSenderId: "1051665363188",
    appId: "1:1051665363188:web:c6389dddb74491a14ceea1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const tg = window.Telegram.WebApp;
tg.ready();

const user = tg.initDataUnsafe?.user;

if (!user) {
    document.body.innerHTML = "<h3>Open inside Telegram</h3>";
    throw new Error("No Telegram user");
}

const userRef = doc(db, "users", String(user.id));

/* Save basic user data */
await setDoc(userRef, {
    telegram_id: user.id,
    chat_id: user.id,
    username: user.username || null,
    first_name: user.first_name || null,
    last_name: user.last_name || null,
    consent_phone: false,
    reward_unlocked: false,
    created_at: serverTimestamp()
}, { merge: true });

/* Load user state */
const snap = await getDoc(userRef);
const data = snap.data();

/* UI logic */
if (data.reward_unlocked === true) {
    document.getElementById("reward").style.display = "block";
} else {
    document.getElementById("consent").style.display = "block";
}

window.sharePhone = async () => {
    await setDoc(userRef, { consent_phone: true }, { merge: true });

    tg.sendData(JSON.stringify({
        action: "REQUEST_PHONE",
        telegram_id: user.id
    }));

    tg.showAlert("Now tap YES in the bot to share your mobile number.");
};
</script>

<style>
body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #020617;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
}
.card {
    background: #0f172a;
    padding: 20px;
    border-radius: 14px;
    max-width: 360px;
    text-align: center;
}
button {
    background: #22c55e;
    color: #000;
    border: none;
    padding: 14px;
    width: 100%;
    border-radius: 10px;
    font-size: 16px;
    margin-top: 16px;
}
.reward {
    display: none;
}
.consent {
    display: none;
}
</style>
</head>

<body>
<div class="card">

    <div id="consent" class="consent">
        <h3>Mobile Number Consent</h3>
        <p>Tap YES to share your phone number and unlock your reward.</p>
        <button onclick="sharePhone()">✅ YES, Share Mobile Number</button>
    </div>

    <div id="reward" class="reward">
        <h3>🎉 Reward Unlocked</h3>
        <p>Thank you. Your premium feature is now active.</p>
    </div>

</div>
</body>
</html>
